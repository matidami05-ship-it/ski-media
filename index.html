<style>

.ref{background:none;border:1px solid var(--line);color:var(--snow);border-radius:8px;padding:7px 12px;font:inherit;font-size:13px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:12px}.grid .card{flex:none;width:auto}
.back{background:none;border:0;color:var(--blue);font:inherit;padding:10px 0;cursor:pointer}

@keyframes bootin{from{opacity:0;transform:translateY(26px) scale(.88)}to{opacity:1;transform:none}}

@media (prefers-reduced-motion:reduce){#boot *,#boot *:after{animation:none!important}#boot .bt i{width:100%}}

body.tv :focus{outline:none}
body.tv .card:focus,body.tv .vc:focus{outline:none;box-shadow:none}
body.tv .card:focus .poster,body.tv .vc:focus .vp{outline:4px solid #fff;outline-offset:2px}
body.tv button:not(.card):not(.vc):focus,body.tv [tabindex]:focus,body.tv input:focus,body.tv select:focus{outline:4px solid #fff;outline-offset:3px;box-shadow:0 0 0 8px rgba(255,255,255,.18)}
body.tv .card:focus,body.tv .vc:focus,body.tv .hz:focus{transform:scale(1.06);z-index:2}
body.tv nav button:focus{background:rgba(255,255,255,.14)}
.epb{display:block;height:3px;background:rgba(255,255,255,.14);border-radius:2px;margin:6px 0 0;overflow:hidden}.epb u{display:block;height:100%;background:var(--red);text-decoration:none}
.cldr{cursor:pointer}
body.dvw header{display:none}
body.dvw #app{padding-top:0}

/* ===== Ski Media UI overhaul ===== */
:root{--bg:#0a1017;--panel:#121b25;--panel2:#18232f;--line:rgba(255,255,255,.08);--snow:#f1f5f8;--mute:#8b9db0;--blue:#4aa8ff;--red:#ff4d5a;--ok:#3ddc97;--r:16px;--sh:0 8px 24px rgba(0,0,0,.35)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f1f5f9;--panel:#fff;--panel2:#f4f7fa;--line:rgba(10,30,50,.1);--snow:#0e1b27;--mute:#5b7083;--sh:0 8px 24px rgba(20,40,60,.1)}}
:root[data-theme="dark"]{--bg:#0a1017;--panel:#121b25;--panel2:#18232f;--line:rgba(255,255,255,.08);--snow:#f1f5f8;--mute:#8b9db0}
body{font-family:Inter,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased;background:var(--bg)}
h1,h2,h3{font-family:inherit;letter-spacing:-.02em}
header{position:sticky;top:0;z-index:4;padding:calc(env(safe-area-inset-top,0px) + 12px) 18px 10px;margin-bottom:2px;background:linear-gradient(var(--bg) 70%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.logo{width:40px;height:40px;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.35)}
header h1{font-size:23px;font-weight:800;letter-spacing:-.03em}
.ref{background:var(--panel);border:1px solid var(--line);color:var(--snow);border-radius:999px;padding:8px 14px;font-weight:600;transition:transform .12s,background .15s}
.ref:active{transform:scale(.95)}
.rfi{width:40px;height:40px;padding:0;display:flex;align-items:center;justify-content:center;margin-left:auto}
.rfi:active svg{transform:rotate(180deg);transition:transform .3s}
main{padding:0 18px 28px}
h2{font-size:20px;font-weight:800;margin:26px 0 12px;display:flex;align-items:baseline;gap:8px}
h2 .by{font-size:12px;font-weight:600;color:var(--mute);letter-spacing:0}
.row{gap:14px;margin:0 -18px;padding:2px 18px 10px}
.card{flex:0 0 132px;display:block;align-self:flex-start;transition:transform .15s}
.card:active{transform:scale(.96)}
.poster{height:198px;border-radius:14px;border:0;box-shadow:var(--sh);background-size:cover;background-position:center}
.poster:after{background:linear-gradient(transparent 60%,rgba(0,0,0,.45))}
.ct{font-size:13px;font-weight:600;margin-top:9px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{font-size:12px;color:var(--mute);margin-top:3px}
.tick{background:var(--ok);border-radius:8px;top:8px;right:8px;font-weight:800;letter-spacing:.2px}
.bar{height:4px;border-radius:2px;background:rgba(255,255,255,.12)}.bar i{background:linear-gradient(90deg,var(--red),#ff8a5b)}
.grid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:16px 12px}.grid .card{flex:none}.grid .poster{height:auto;aspect-ratio:2/3}
.hz{display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;gap:4px;width:100%;min-height:min(62vw,300px);margin:6px 0 0;padding:18px;border:0;border-radius:22px;background-size:cover;background-position:center top;color:#fff;text-align:left;font:inherit;cursor:pointer;box-shadow:var(--sh);overflow:hidden;position:relative}
.hz b{font-size:28px;font-weight:800;letter-spacing:-.03em;line-height:1.1;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.hz small{font-size:13px;color:#dbe6ee}
.hzk{font-size:11px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:#fff;background:var(--red);padding:3px 9px;border-radius:999px}
.hzb{margin-top:10px;background:#fff;color:#0a1017;font-weight:800;font-size:14px;padding:10px 18px;border-radius:999px}
nav{margin:0 12px calc(8px + env(safe-area-inset-bottom,0px));padding:6px;border:1px solid var(--line);border-radius:24px;background:color-mix(in srgb,var(--panel) 88%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 10px 30px rgba(0,0,0,.4);gap:2px}
nav button{border-radius:18px;padding:7px 0 6px;gap:2px;font-size:10px;font-weight:600;transition:background .2s,color .2s}
nav button svg{width:21px;height:21px}
nav button[aria-current="true"]{background:rgba(255,77,90,.16);color:var(--red)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
.panel h3{font-size:16px;font-weight:800}
input,select{border-radius:14px;border:1px solid var(--line);background:var(--panel2);padding:13px 14px;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 3px rgba(74,168,255,.25)}
input[type=search]{-webkit-appearance:none;appearance:none}
.btn{background:linear-gradient(135deg,var(--red),#ff7a59);border-radius:14px;padding:13px 18px;font-weight:800;box-shadow:0 6px 16px rgba(255,77,90,.3);transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.alt{background:var(--panel2);border:1px solid var(--line);box-shadow:none;color:var(--snow)}
.status{border-radius:999px;padding:3px 10px;font-weight:700}
.src{border-top:1px solid var(--line)}
.tvc,.vseg button{border-radius:999px;background:var(--panel);border:1px solid var(--line);font-weight:600}
.tvc[aria-pressed="true"],.vseg button[aria-pressed="true"]{background:var(--snow);color:var(--bg);border-color:var(--snow)}
.tvg{gap:8px;margin:12px -18px;padding:0 18px 4px}
.vg{gap:14px 10px}.vp{border-radius:12px;border:0;box-shadow:var(--sh)}.vc small{color:var(--snow);font-weight:600;font-size:12px}
.vseg button{border-radius:999px}
.tvl{border-radius:12px}
.toast{background:var(--snow);color:var(--bg);font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.4);bottom:104px;border-radius:999px;padding:11px 18px}
.dthero{margin:0 -18px}
.playbig{border-radius:999px}
.note{line-height:1.5}
#app>*{animation:rise .35s cubic-bezier(.2,.7,.2,1) both}
#app>*:nth-child(2){animation-delay:.04s}#app>*:nth-child(3){animation-delay:.08s}#app>*:nth-child(4){animation-delay:.12s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#app>*{animation:none}}
.card .poster:empty,.poster{background-color:var(--panel2)}
</style>
</head>

function parseM3u(t){const out=[],L=String(t).split(/\r?\n/);let cur=null;
for(const raw of L){const l=raw.trim();if(!l)continue;
if(l.startsWith("#EXTINF")){const a=k=>{const m=l.match(new RegExp(k+'="([^"]*)"','i'));return m?m[1]:""};
let c=-1,q=0;for(let k=0;k<l.length;k++){const ch=l[k];if(ch=='"')q=!q;else if(ch===","&&!q){c=k;break}}cur={n:(c>=0?l.slice(c+1).trim():"")||a("tvg-name")||"Channel",logo:a("tvg-logo"),grp:a("group-title")||"Other"}}
else if(l.startsWith("#EXTGRP:")){if(cur)cur.grp=l.slice(8).trim()||cur.grp}
else if(l[0]!=="#"){if(cur){cur.url=l;out.push(cur);cur=null}else if(/^https?:/i.test(l)){out.push({n:l.split("/").pop(),logo:"",grp:"Other",url:l})}}}
return out}
async function tvFetch(l){
if(l.type==="xt"){const b=l.url.replace(/\/+$/,""),q=`username=${encodeURIComponent(l.user)}&password=${encodeURIComponent(l.pass)}`;
const [cs,ss]=await Promise.all([Ski.px(`${b}/player_api.php?${q}&action=get_live_categories`).then(r=>r.json()),Ski.px(`${b}/player_api.php?${q}&action=get_live_streams`).then(r=>r.json())]);
if(!Array.isArray(ss))throw new Error("Login failed");const cm={};(Array.isArray(cs)?cs:[]).forEach(c=>cm[c.category_id]=c.category_name);
return ss.map(x=>({n:x.name||"Channel",logo:x.stream_icon||"",grp:cm[x.category_id]||"Other",url:`${b}/live/${encodeURIComponent(l.user)}/${encodeURIComponent(l.pass)}/${x.stream_id}.m3u8`}))}
const r=await Ski.px(l.url);if(!r.ok)throw new Error("HTTP "+r.status);const t=await r.text();
if(!/#EXTINF|^https?:/im.test(t))throw new Error("Not a valid playlist");return parseM3u(t)}

if(!force&&TV.lid===S.iptv.act&&TV.ch.length)return;if(TV.busy)return;

try{TV.ch=await tvFetch(l);TV.lid=S.iptv.act;TV.lim=150;if(!TV.ch.length)TV.err="No channels found in this playlist."}catch(e){TV.ch=[];TV.err="Couldn't load the playlist ("+(e.message||"error")+"). Check the link and try again."}
TV.busy=0;tvPaint()}

function tvRows(){const a=tvFiltered();if(!a.length)return'<p class="meta" style="padding:14px 0">'+(S.iptv.grp==="Favorites"&&!TV.q?"Tap the star on a channel to add it to Favorites.":"No channels match.")+'</p>';
return a.slice(0,TV.lim).map(c=>{const i=TV.ch.indexOf(c),f=S.iptv.fav.includes(c.url);
return'<div class="src tvr" tabindex="0" data-tvp="'+i+'" role="button"><div class="tvl"'+(c.logo?' style="background-image:url('+esc(c.logo)+')"':'')+'>'+(c.logo?'':esc(initials(c.n)))+'</div><div style="flex:1;min-width:0"><b class="tvn">'+esc(c.n)+'</b><small>'+esc(c.grp)+'</small></div><button class="btn alt tvf" style="margin:0;padding:8px 12px" data-tvf="'+i+'" aria-label="Favorite">'+(f?"★":"☆")+'</button></div>'}).join("")+(a.length>TV.lim?'<button class="btn alt" data-tvmore style="width:100%;margin-top:10px">Show more ('+(a.length-TV.lim)+' left)</button>':"")}
function tvTab(){const I=S.iptv;
if(!I.lists.length)return'<h2>Live TV</h2><div class="panel"><h3>Add an IPTV playlist</h3><p>Add an M3U link or Xtream Codes login from your IPTV provider and your channels show up here. Ski Media does not include any channels.</p><button class="btn" data-tab="settings">Open settings</button></div>';
const sel=I.lists.length>1?'<select id="tvsel" style="margin-bottom:10px">'+I.lists.map((l,n)=>'<option value="'+n+'"'+(n===I.act?" selected":"")+'>'+esc(l.name)+'</option>').join("")+'</select>':"";
const gs=["All","Favorites"].concat(tvGroups());
return'<h2 style="display:flex;justify-content:space-between;align-items:center">Live TV<button class="ref" data-tvrefresh style="margin:0">Reload</button></h2>'+sel+
(TV.busy?'<p class="meta">Loading channels…</p>':TV.err?'<div class="panel"><p>'+esc(TV.err)+'</p></div>':
'<input id="tq" placeholder="Search channels" value="'+esc(TV.q)+'" autocomplete="off"><div class="row tvg">'+gs.map(g=>'<button class="tvc" aria-pressed="'+(I.grp===g)+'" data-tvg="'+esc(g)+'">'+esc(g)+'</button>').join("")+'</div><div id="tvl">'+tvRows()+'</div>')}
function tvPlay(i){const c=TV.ch[i];if(!c)return;playAny(c.url,c.n,null,true)}
function tvOverlay(c){tvClose();const o=document.createElement("div");o.id="tvp";
o.innerHTML='<video playsinline autoplay controls></video><button class="bk" aria-label="Close">'+IC.back+'</button><div class="tvt">'+esc(c.n)+'</div>';
document.body.appendChild(o);const v=o.querySelector("video");v.src=c.url;v.play().catch(()=>{});
v.addEventListener("error",()=>toast("This stream can't play in the in-app player. Try VLC."));
o.querySelector(".bk").onclick=tvClose}
function tvClose(){const o=document.getElementById("tvp");if(o){const v=o.querySelector("video");try{v.pause();v.removeAttribute("src");v.load()}catch(e){}o.remove()}}
document.addEventListener("click",e=>{const el=e.target.closest("[data-tvp],[data-tvf],[data-tvg],[data-tvmore],[data-tvrefresh],[data-iadd],[data-irm]");if(!el)return;const d=el.dataset;
if(d.tvf!==undefined){e.stopPropagation();const c=TV.ch[+d.tvf];if(c){const f=S.iptv.fav,k=f.indexOf(c.url);if(k<0)f.push(c.url);else f.splice(k,1);save();const l=$("#tvl");if(l)l.innerHTML=tvRows()}return}
if(d.tvp!==undefined){tvPlay(+d.tvp);return}
if(d.tvg!==undefined){S.iptv.grp=d.tvg;TV.lim=150;save();tvPaint();return}
if(d.tvmore!==undefined){TV.lim+=150;const l=$("#tvl");if(l)l.innerHTML=tvRows();return}

if(d.irm!==undefined){S.iptv.lists.splice(+d.irm,1);S.iptv.act=0;TV.ch=[];TV.lid=-1;VOD.lid=-1;VOD.mv=[];VOD.sr=[];save();render();toast("Playlist removed");return}
if(d.iadd!==undefined){const t=$("#itype").value,u=$("#iurl").value.trim(),nm=$("#iname").value.trim();
if(!/^https?:\/\/.+/i.test(u)){toast("Enter a full http(s) link");return}
let l={type:t,url:u,name:nm||(t==="xt"?"Xtream":"Playlist")+" "+(S.iptv.lists.length+1)};
if(t==="xt"){l.user=$("#iuser").value.trim();l.pass=$("#ipass").value.trim();if(!l.user||!l.pass){toast("Enter the username and password");return}}
S.iptv.lists.push(l);S.iptv.act=S.iptv.lists.length-1;S.iptv.grp="All";TV.ch=[];TV.lid=-1;VOD.lid=-1;VOD.mv=[];VOD.sr=[];save();render();toast("Playlist added. Open the TV tab.")}
});
document.addEventListener("change",e=>{if(e.target.id==="itype"){const x=e.target.value==="xt";$("#iuser").style.display=x?"":"none";$("#ipass").style.display=x?"":"none";$("#iurl").placeholder=x?"http://server:port":"https://example.com/playlist.m3u"}
if(e.target.id==="tvsel"){S.iptv.act=+e.target.value;S.iptv.grp="All";TV.ch=[];TV.lid=-1;save();tvLoad()}});
document.addEventListener("input",e=>{if(e.target.id==="tq"){TV.q=e.target.value;TV.lim=150;const l=$("#tvl");if(l)l.innerHTML=tvRows()}});


/* ---------- VOD from IPTV ---------- */
const VOD={lid:-1,mv:[],sr:[],busy:0,err:"",mode:"m",q:"",cat:"All",lim:90};
async function vodFetch(l){
if(l.type==="xt"){const b=l.url.replace(/\/+$/,""),q=`username=${encodeURIComponent(l.user)}&password=${encodeURIComponent(l.pass)}`,g=a=>Ski.px(`${b}/player_api.php?${q}&action=${a}`).then(r=>r.json()).catch(()=>[]);
const [mc,ms,sc,ss]=await Promise.all([g("get_vod_categories"),g("get_vod_streams"),g("get_series_categories"),g("get_series")]);
const cm=a=>{const o={};(Array.isArray(a)?a:[]).forEach(c=>o[c.category_id]=c.category_name);return o},mm=cm(mc),sm=cm(sc);
const mv=(Array.isArray(ms)?ms:[]).map(x=>({id:x.stream_id,n:x.name||"Movie",img:x.stream_icon||"",cat:mm[x.category_id]||"Other",rating:x.rating||"",url:`${b}/movie/${encodeURIComponent(l.user)}/${encodeURIComponent(l.pass)}/${x.stream_id}.${x.container_extension||"mp4"}`}));
const sr=(Array.isArray(ss)?ss:[]).map(x=>({sid:x.series_id,n:x.name||"Series",img:x.cover||"",cat:sm[x.category_id]||"Other",rating:x.rating||"",plot:x.plot||""}));
if(!mv.length&&!sr.length)throw new Error("No movies or shows found (or login failed)");return{mv,sr}}
const r=await Ski.px(l.url);if(!r.ok)throw new Error("HTTP "+r.status);const ch=parseM3u(await r.text()),mv=[],sm={};
ch.forEach(c=>{if(/\/movie\//i.test(c.url))mv.push({n:c.n,img:c.logo,cat:c.grp,url:c.url,rating:""});
else if(/\/series\//i.test(c.url)){const m=c.n.match(/^(.*?)[\s._-]*[Ss](\d{1,2})\s*[Ee](\d{1,3})/);const t=m?m[1].trim():c.n,se=m?+m[2]:1,ep=m?+m[3]:1;
const o=sm[t]||(sm[t]={n:t,img:c.logo,cat:c.grp,rating:"",plot:"",eps:[]});o.eps.push({s:se,e:ep,t:c.n,url:c.url})}});
if(!mv.length&&!Object.keys(sm).length)throw new Error("No movies or series found in this playlist");return{mv,sr:Object.values(sm)}}
async function vodLoad(force){const l=S.iptv.lists[S.iptv.act];if(!l)return;
if(!force&&VOD.lid===S.iptv.act&&(VOD.mv.length||VOD.sr.length))return;if(VOD.busy)return;
VOD.busy=1;VOD.err="";vodPaint();
try{const r=await vodFetch(l);VOD.mv=r.mv;VOD.sr=r.sr;VOD.lid=S.iptv.act;VOD.lim=90;VOD.cat="All"}catch(e){VOD.mv=[];VOD.sr=[];VOD.err="Couldn't load movies and shows ("+(e.message||"error")+")."}
VOD.busy=0;vodPaint()}
function vodPaint(){if(S.tab!=="vod"||view!==null)return;const a=$("#app");if(a)a.innerHTML=vodTab()}
function vodItems(){return VOD.mode==="m"?VOD.mv:VOD.sr}
function vodCats(){const g={};vodItems().forEach(c=>g[c.cat]=1);return Object.keys(g).sort((a,b)=>a.localeCompare(b))}
function vodFiltered(){const q=VOD.q.trim().toLowerCase();let a=vodItems();if(VOD.cat!=="All")a=a.filter(c=>c.cat===VOD.cat);if(q)a=a.filter(c=>c.n.toLowerCase().includes(q));return a}
function vodGrid(){const a=vodFiltered();if(!a.length)return'<p class="meta" style="padding:14px 0">Nothing found.</p>';
const arr=vodItems();
return'<div class="vg">'+a.slice(0,VOD.lim).map(c=>{const i=arr.indexOf(c);return'<button class="vc" data-vo="'+i+'"><div class="vp"'+(c.img?' style="background-image:url('+esc(c.img)+')"':'')+'>'+(c.img?'':'<b>'+esc(c.n)+'</b>')+'</div><small>'+esc(c.n)+'</small></button>'}).join("")+'</div>'+(a.length>VOD.lim?'<button class="btn alt" data-vmore style="width:100%;margin-top:10px">Show more ('+(a.length-VOD.lim)+' left)</button>':"")}
function vodTab(){const I=S.iptv;
if(!I.lists.length)return'<h2>VOD</h2><div class="panel"><h3>Add an IPTV playlist</h3><p>Movies and shows come from your IPTV provider. Add an Xtream Codes login (best) or an M3U link in Settings.</p><button class="btn" data-tab="settings">Open settings</button></div>';
const sel=I.lists.length>1?'<select id="vsel" style="margin-bottom:10px">'+I.lists.map((l,n)=>'<option value="'+n+'"'+(n===I.act?" selected":"")+'>'+esc(l.name)+'</option>').join("")+'</select>':"";
return'<h2 style="display:flex;justify-content:space-between;align-items:center">VOD<button class="ref" data-vrefresh style="margin:0;font-family:inherit">Reload</button></h2>'+sel+
(VOD.busy?'<p class="meta">Loading movies and shows…</p>':VOD.err?'<div class="panel"><p>'+esc(VOD.err)+'</p></div>':
'<div class="vseg"><button data-vm="m" aria-pressed="'+(VOD.mode==="m")+'">Movies ('+VOD.mv.length+')</button><button data-vm="s" aria-pressed="'+(VOD.mode==="s")+'">Series ('+VOD.sr.length+')</button></div><input id="vq" placeholder="Search" value="'+esc(VOD.q)+'" autocomplete="off"><div class="row tvg">'+["All"].concat(vodCats()).map(g=>'<button class="tvc" aria-pressed="'+(VOD.cat===g)+'" data-vcat="'+esc(g)+'">'+esc(g)+'</button>').join("")+'</div><div id="vgrid">'+vodGrid()+'</div>')}
function vodPlay(url,title){playAny(url,title,"v|"+url)}
async function vodOpen(i){const it=vodItems()[i];if(!it)return;vodClose();
const o=document.createElement("div");o.id="vodd";const mv=VOD.mode==="m";
o.innerHTML='<button class="bk" aria-label="Close">'+IC.back+'</button><div class="vdi"><div class="vdp"'+(it.img?' style="background-image:url('+esc(it.img)+')"':'')+'></div><h1>'+esc(it.n)+'</h1><div class="meta" id="vdm">'+[it.rating&&+it.rating?"\u2605 "+(+it.rating).toFixed(1):"",esc(it.cat||"")].filter(Boolean).join(" \u00b7 ")+'</div><p id="vdp" class="meta">'+esc(it.plot||"")+'</p>'+(mv?'<button class="btn" id="vdplay" style="width:100%">Play</button>':'<div id="vdeps"><p class="meta">Loading episodes…</p></div>')+'</div>';
document.body.appendChild(o);o.querySelector(".bk").onclick=vodClose;
const l=S.iptv.lists[S.iptv.act],b=(l.url||"").replace(/\/+$/,""),q=l.type==="xt"?`username=${encodeURIComponent(l.user)}&password=${encodeURIComponent(l.pass)}`:"";
if(mv){o.querySelector("#vdplay").onclick=()=>vodPlay(it.url,it.n);
if(l.type==="xt"&&it.id){try{const j=await(await Ski.px(`${b}/player_api.php?${q}&action=get_vod_info&vod_id=${it.id}`)).json(),f=j.info||{},p=o.querySelector("#vdp");if(p&&document.getElementById("vodd")===o)p.textContent=f.plot||f.description||""}catch(e){}}return}
let eps=it.eps;
if(!eps&&l.type==="xt"){try{const j=await(await Ski.px(`${b}/player_api.php?${q}&action=get_series_info&series_id=${it.sid}`)).json();eps=[];const E=j.episodes||{};
Object.keys(E).forEach(k=>(E[k]||[]).forEach(x=>eps.push({s:+(x.season||k)||1,e:+x.episode_num||0,t:x.title||("Episode "+x.episode_num),plot:(x.info||{}).plot||"",url:`${b}/series/${encodeURIComponent(l.user)}/${encodeURIComponent(l.pass)}/${x.id}.${x.container_extension||"mp4"}`})));
const inf=j.info||{},p=o.querySelector("#vdp");if(p&&!it.plot)p.textContent=inf.plot||""}catch(e){eps=[]}}
if(document.getElementById("vodd")!==o)return;eps=(eps||[]).sort((a,b)=>a.s-b.s||a.e-b.e);const box=o.querySelector("#vdeps");
if(!eps.length){box.innerHTML='<p class="meta">No episodes found.</p>';return}
const seasons=[...new Set(eps.map(e=>e.s))];let cur=seasons[0];
const draw=()=>{box.innerHTML=(seasons.length>1?'<select id="vds">'+seasons.map(s=>'<option value="'+s+'"'+(s===cur?" selected":"")+'>Season '+s+'</option>').join("")+'</select>':"")+eps.filter(e=>e.s===cur).map((e,n)=>'<div class="src vep" tabindex="0" data-n="'+eps.indexOf(e)+'" role="button"><div style="flex:1;min-width:0"><b class="tvn">'+(e.e?e.e+". ":"")+esc(e.t)+'</b>'+(e.plot?'<small>'+esc(e.plot.slice(0,90))+'</small>':'')+'</div><span>▶</span></div>').join("");
const sl=box.querySelector("#vds");if(sl)sl.onchange=()=>{cur=+sl.value;draw()};
box.querySelectorAll(".vep").forEach(r=>r.onclick=()=>{const e=eps[+r.dataset.n];vodPlay(e.url,it.n+" S"+e.s+"E"+e.e)})};draw()}
function vodClose(){const o=document.getElementById("vodd");if(o)o.remove()}
document.addEventListener("click",e=>{const el=e.target.closest("[data-vo],[data-vm],[data-vcat],[data-vmore],[data-vrefresh]");if(!el)return;const d=el.dataset;
if(d.vo!==undefined){vodOpen(+d.vo);return}
if(d.vm!==undefined){VOD.mode=d.vm;VOD.cat="All";VOD.lim=90;vodPaint();return}
if(d.vcat!==undefined){VOD.cat=d.vcat;VOD.lim=90;vodPaint();return}
if(d.vmore!==undefined){VOD.lim+=90;const g=$("#vgrid");if(g)g.innerHTML=vodGrid();return}
if(d.vrefresh!==undefined){vodLoad(true);return}});
document.addEventListener("change",e=>{if(e.target.id==="vsel"){S.iptv.act=+e.target.value;VOD.lid=-1;VOD.mv=[];VOD.sr=[];save();vodLoad()}});
document.addEventListener("input",e=>{if(e.target.id==="vq"){VOD.q=e.target.value;VOD.lim=90;const g=$("#vgrid");if(g)g.innerHTML=vodGrid()}});


/* ---------- Android TV mode: remote control navigation ---------- */
function isTvMode(){const p=S.tvmode||"auto";if(window.__SKI_FORCE_TV&&p!=="off")return true;return p==="on"||(p==="auto"&&/Android/i.test(navigator.userAgent)&&!("ontouchstart" in window)&&!(navigator.maxTouchPoints>0))}
function focusSig(){const a=document.activeElement;if(!a||a===document.body)return null;for(const k in a.dataset)return"[data-"+k.replace(/[A-Z]/g,c=>"-"+c.toLowerCase())+'="'+String(a.dataset[k]).replace(/"/g,'\\"')+'"]';return a.id?"#"+a.id:null}
const _render=render;
render=function(){const tv=document.body.classList.contains("tv"),sig=tv?focusSig():null;_render();
const on=isTvMode();document.body.classList.toggle("tv",on);if(!on)return;
let f=null;if(sig){try{f=document.querySelector(sig)}catch(e){}}
if(!f&&(!document.activeElement||document.activeElement===document.body))f=document.querySelector('nav [aria-current="true"]')||document.querySelector("nav button");
if(f)try{f.focus({preventScroll:true})}catch(e){}};
(function(){
const SEL='button:not([disabled]),a[href],input:not([type=hidden]):not([disabled]),select:not([disabled]),textarea,[tabindex]:not([tabindex="-1"])';
function scope(){return document.querySelector("#tvp")||document.querySelector("#vodd")||document.querySelector("#pv")||document}
function cands(){return[...scope().querySelectorAll(SEL)].filter(e=>{const r=e.getBoundingClientRect();if(r.width<6||r.height<6)return false;const cs=getComputedStyle(e);return cs.visibility!=="hidden"&&cs.display!=="none"})}
function go(dx,dy){const a=document.activeElement,list=cands();if(!list.length)return false;
if(!a||a===document.body||!list.includes(a)){const f=list.find(e=>e.closest("nav"))||list[0];f.focus();return true}
const r=a.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let best=null,bs=1e12;
for(const e of list){if(e===a)continue;const q=e.getBoundingClientRect(),ex=q.left+q.width/2,ey=q.top+q.height/2;
const ddx=ex-cx,ddy=ey-cy;let main=dx?ddx*dx:ddy*dy;if(main<=2)continue;
let cross=dx?Math.abs(ddy):Math.abs(ddx);
const ov=dx?Math.min(r.bottom,q.bottom)-Math.max(r.top,q.top):Math.min(r.right,q.right)-Math.max(r.left,q.left);
let sc=main+cross*(ov>0?1:3);
if(e.closest("nav")&&!a.closest("nav")&&dx>=0)sc+=1e4;
if(sc<bs){bs=sc;best=e}}
if(!best)return false;best.focus({preventScroll:true});best.scrollIntoView({block:"nearest",inline:"center"});return true}
document.addEventListener("keydown",e=>{if(!document.body.classList.contains("tv"))return;
const a=document.activeElement,k=e.key;
if((k==="Enter"||k===" ")&&a&&a.matches&&a.matches('[role="button"],.ep')&&!(a.tagName==="BUTTON")){e.preventDefault();a.click();return}
const D={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[k];if(!D)return;
if(a&&(a.tagName==="INPUT"&&!/checkbox|button/.test(a.type)&&D[0]!==0&&a.value))return;
if(a&&a.tagName==="SELECT")return;
if(go(D[0],D[1]))e.preventDefault()});
document.addEventListener("change",e=>{if(e.target.id==="tvm"){S.tvmode=e.target.value;save();render()}});
})();

window.__skiBack=function(){try{if(closeTrailer())return 1;if(document.getElementById("tvp")){tvClose();return 1}if(document.getElementById("vodd")){vodClose();return 1}if(history.state&&history.state.pv){history.back();return 1}if(view!==null&&view!==undefined){view=null;render();return 1}}catch(e){}return 0};
render();
(function(){const b=document.getElementById("boot");if(!b)return;let done=0;
function end(){if(done)return;done=1;b.classList.add("out");setTimeout(()=>b.remove(),600)}
const rm=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
setTimeout(end,rm?700:2700);b.addEventListener("click",end)})();
