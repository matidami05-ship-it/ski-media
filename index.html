<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ski Media</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0d1b24">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#0d1b24;--panel:#15293a;--line:#24425a;--snow:#eaf3f7;--mute:#8fa9ba;--blue:#2f8fd8;--red:#e23d45;--ok:#49c28a}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#eef4f7;--panel:#fff;--line:#cddbe4;--snow:#10222f;--mute:#5d788a}}
:root[data-theme="dark"]{--bg:#0d1b24;--panel:#15293a;--line:#24425a;--snow:#eaf3f7;--mute:#8fa9ba}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--snow);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;line-height:1.45;padding-bottom:76px}
h1,h2,h3{font-family:"Georgia","Times New Roman",serif;font-weight:700;margin:0}
header{padding:18px 18px 6px;display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px}
header h1{font-size:24px;letter-spacing:.2px}
header span{color:var(--mute);font-size:13px;margin-left:auto}
main{padding:0 18px 20px;max-width:760px;margin:0 auto}
h2{font-size:19px;margin:22px 0 10px}
.row{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.card{flex:0 0 128px;cursor:pointer;background:none;border:0;color:inherit;text-align:left;padding:0;font:inherit}
.poster{height:182px;border-radius:6px;padding:10px;display:flex;align-items:flex-end;font-family:Georgia,serif;font-size:15px;font-weight:700;color:#fff;position:relative;overflow:hidden;border:1px solid var(--line)}
.poster:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 45%,rgba(0,0,0,.65))}
.poster b{position:relative;z-index:1}
.meta{font-size:12px;color:var(--mute);margin-top:5px}
.bar{height:4px;background:var(--line);border-radius:2px;margin-top:6px}
.bar i{display:block;height:100%;background:var(--red);border-radius:2px}
.tick{position:absolute;top:8px;right:8px;z-index:2;background:var(--ok);color:#06241a;border-radius:10px;font-size:11px;padding:1px 7px;font-weight:700}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;border:0;color:var(--mute);font:inherit;font-size:12px;padding:8px 0;border-radius:8px;cursor:pointer}
nav button[aria-current="true"]{color:var(--snow);background:var(--bg)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.panel h3{font-size:16px;margin-bottom:4px}
.panel p{margin:0 0 10px;color:var(--mute);font-size:14px}
label{display:block;font-size:13px;color:var(--mute);margin:8px 0 4px}
input,select{width:100%;padding:11px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--snow);font:inherit;font-size:15px}
.btn{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:11px 16px;font:inherit;font-weight:700;cursor:pointer;margin-top:10px}
.btn.alt{background:none;border:1px solid var(--line);color:var(--snow)}
.btn.red{background:var(--red)}
.status{display:inline-block;font-size:12px;padding:2px 9px;border-radius:10px;border:1px solid var(--line);color:var(--mute);margin-bottom:8px}
.status.on{border-color:var(--ok);color:var(--ok)}
.hero{border-radius:10px;padding:16px;min-height:200px;display:flex;flex-direction:column;justify-content:flex-end;border:1px solid var(--line);margin-top:8px}
.hero h2{margin:0;font-size:26px;color:#fff}
.hero p{margin:4px 0 0;color:#dfeaf0;font-size:14px}
.src{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.src:first-child{border-top:0}
.src div{flex:1;min-width:0}
.src small{color:var(--mute);display:block}
.chip{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:700}
.cached{background:var(--ok);color:#06241a}
.direct{background:var(--blue);color:#fff}
.lock{background:var(--line);color:var(--mute)}
.note{font-size:12px;color:var(--mute);margin-top:14px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--snow);color:var(--bg);padding:9px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%}
.toast.show{opacity:1}
.player{background:#000;border-radius:10px;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;color:#fff;margin-top:12px;text-align:center;padding:12px;font-size:14px}
.facts{display:flex;gap:18px;font-size:13px;color:var(--mute);margin:12px 0}.facts b{color:var(--snow);font-size:19px;font-family:Georgia,serif;display:block}.tags{display:flex;gap:6px;flex-wrap:wrap}.cast{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;margin-top:10px}.who{flex:0 0 78px;text-align:center;font-size:12px}.av{width:58px;height:58px;border-radius:50%;margin:0 auto 6px;background:var(--line);display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;font-weight:700;overflow:hidden}.av img{width:100%;height:100%;object-fit:cover}
.ref{background:none;border:1px solid var(--line);color:var(--snow);border-radius:8px;padding:7px 12px;font:inherit;font-size:13px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:12px}.grid .card{flex:none;width:auto}
.back{background:none;border:0;color:var(--blue);font:inherit;padding:10px 0;cursor:pointer}
</style>
</head>
<body>
<header>
<svg class="logo" viewBox="0 0 40 40" aria-hidden="true"><path d="M2 34 L15 10 L22 22 L27 15 L38 34Z" fill="#2f8fd8"/><path d="M15 10 L19 18 L15 16 L11 18Z" fill="#eaf3f7"/><circle cx="31" cy="9" r="3.5" fill="#e23d45"/></svg>
<h1>Ski Media</h1><span id="hdr"></span><button class="ref" data-refresh aria-label="Refresh">Refresh</button>
</header>
<main id="app"></main>
<nav id="nav"></nav>
<div class="toast" id="toast"></div>

<script src="engine.js"></script>
<script>
const GRAD=[["#2f5d8a","#0d1b24"],["#8a2f3b","#1d0d12"],["#3c6e5a","#0c1d17"],["#7a5a2f","#1e150a"],["#4b3c8a","#12101f"],["#2f7a86","#0a1c20"]];
const CAT=[
{id:"tt0013442",t:"Nosferatu",y:1922,type:"movie",d:"A count from the Carpathians brings plague and dread to a quiet port town.",g:0},
{id:"tt0017136",t:"Metropolis",y:1927,type:"movie",d:"In a city of towers and machines, a worker's son crosses the divide between classes.",g:4},
{id:"tt0000417",t:"A Trip to the Moon",y:1902,type:"movie",d:"Astronomers launch a capsule into the eye of the moon.",g:5},
{id:"tt0063350",t:"Night of the Living Dead",y:1968,type:"movie",d:"Strangers barricade themselves in a farmhouse through one long night.",g:1},
{id:"tt0032599",t:"His Girl Friday",y:1940,type:"movie",d:"An editor schemes to win back his ex-wife and his best reporter.",g:3},
{id:"tt0056923",t:"Charade",y:1963,type:"movie",d:"A widow in Paris is chased by men who want her late husband's fortune.",g:2}
];
const META={
tt0013442:{r:7.9,rt:94,gen:["Horror","Fantasy"],dir:"F. W. Murnau",cast:["Max Schreck","Gustav von Wangenheim","Greta Schröder"]},
tt0017136:{r:8.2,rt:153,gen:["Science Fiction","Drama"],dir:"Fritz Lang",cast:["Brigitte Helm","Alfred Abel","Gustav Fröhlich"]},
tt0000417:{r:7.9,rt:12,gen:["Science Fiction","Adventure"],dir:"Georges Méliès",cast:["Georges Méliès","Bleuette Bernon","Victor André"]},
tt0063350:{r:7.8,rt:96,gen:["Horror","Thriller"],dir:"George A. Romero",cast:["Duane Jones","Judith O'Dea","Karl Hardman"]},
tt0032599:{r:7.8,rt:92,gen:["Comedy","Romance"],dir:"Howard Hawks",cast:["Cary Grant","Rosalind Russell","Ralph Bellamy"]},
tt0056923:{r:7.9,rt:113,gen:["Comedy","Mystery","Romance"],dir:"Stanley Donen",cast:["Cary Grant","Audrey Hepburn","Walter Matthau"]}};
const TM={};
async function loadTmdb(i){const id=CAT[i].id;if(!S.tmdb.on||TM[id]||loadTmdb.p===id)return;loadTmdb.p=id;
try{const k=encodeURIComponent(S.tmdb.key),b="https://api.themoviedb.org/3",im="https://image.tmdb.org/t/p/",x=META[id];
let kind="movie",tid=CAT[i].tid;if(tid){kind=isTv(CAT[i])?"tv":"movie"}else{const f=await(await fetch(`${b}/find/${id}?external_source=imdb_id&api_key=${k}`)).json();const mv=f.movie_results&&f.movie_results[0];if(!mv)throw 0;tid=mv.id}
const d=await(await fetch(`${b}/${kind}/${tid}?append_to_response=credits,external_ids&api_key=${k}`)).json();
const cr=d.credits||{};
TM[id]={ov:d.overview,r:d.vote_average||x.r,rt:d.runtime||(d.episode_run_time||[])[0]||x.rt,gen:(d.genres||[]).map(g=>g.name),dir:((cr.crew||[]).find(p=>p.job==="Director")||{}).name||((d.created_by||[])[0]||{}).name||x.dir,cast:(cr.cast||[]).slice(0,10).map(p=>({n:p.name,img:p.profile_path?im+"w185"+p.profile_path:""})),bd:d.backdrop_path?im+"w780"+d.backdrop_path:""};
const ix=d.external_ids&&d.external_ids.imdb_id;if(ix&&!CAT[i].aid&&!/^tt/.test(CAT[i].id)){CAT[i].aid=ix;save()}if(view===i)render();
}catch(e){toast("TMDB unavailable. Showing sample details.")}
loadTmdb.p=null}
function tm(i){return S.tmdb.on&&TM[CAT[i].id]||null}
function heroBg(i){const t=tm(i);return t&&t.bd?`background:linear-gradient(transparent 30%,rgba(0,0,0,.75)),url(${t.bd}) center/cover`:grad(i)}
function cine(i){const m=CAT[i],x=META[m.id],t=tm(i)||{},g=t.gen&&t.gen.length?t.gen:x.gen,cast=t.cast&&t.cast.length?t.cast:x.cast.map(n=>({n,img:""}));
return `<p>${esc(t.ov||m.d)}</p>
<div class="facts"><span><b>${(t.r||x.r).toFixed(1)}</b>Rating</span><span><b>${t.rt||x.rt}</b>Minutes</span><span><b>${m.y}</b>Released</span></div>
<div class="tags">${g.map(v=>`<span class="chip lock">${esc(v)}</span>`).join("")}</div>
<h2>Cast and crew</h2><p class="meta" style="margin:0">Directed by <b style="color:var(--snow)">${esc(t.dir||x.dir)}</b></p>
<div class="cast">${cast.map(p=>`<div class="who"><div class="av">${p.img?`<img src="${esc(p.img)}" alt="">`:esc(p.n.split(" ").map(w=>w[0]).slice(0,2).join(""))}</div>${esc(p.n)}</div>`).join("")}</div>
<p class="note">${t.r?"Details from TMDB.":"Sample details. Link TMDB in Settings for live data."} This product uses the TMDB API but is not endorsed or certified by TMDB.</p>`}
const SRC=[
{n:"Public Domain Archive",q:"1080p",s:"Direct stream",k:"direct"},
{n:"Community Addon · 1080p",q:"1080p",s:"Debrid cached",k:"cached"},
{n:"Community Addon · 4K",q:"2160p",s:"Debrid cached",k:"cached"},
{n:"Community Addon · 720p",q:"720p",s:"Needs debrid account",k:"lock"}
];
const PROVIDERS=["Real-Debrid","AllDebrid","Premiumize","TorBox","Debrid-Link"];

let S;
try{S=JSON.parse(localStorage.getItem("ski")||"null")}catch(e){S=null}
S=S||{tab:"home",watched:{},progress:{2:.4,0:.15},watchlist:[],simkl:{on:false,token:"",scrobble:true},debrid:{on:false,prov:"Real-Debrid",token:""},addons:[],queue:[]};
S.tmdb=S.tmdb||{on:false,key:""};
S.debrids=S.debrids||(S.debrid&&S.debrid.on?[{prov:S.debrid.prov,token:S.debrid.token}]:[]);
S.addons=(S.addons||[]).filter(a=>a&&typeof a==="object");S.eps=S.eps||{};S.extra=S.extra||[];S.extra.forEach(o=>{CAT.push(o);META[o.id]={r:0,rt:0,gen:[],dir:"Unknown",cast:[]}});
function save(){try{localStorage.setItem("ski",JSON.stringify(S))}catch(e){}}
let view=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove("show"),2200)}
function grad(i){const g=GRAD[CAT[i].g];return `background:linear-gradient(160deg,${g[0]},${g[1]})`}
function card(i,showBar){const m=CAT[i];
return `<button class="card" data-open="${i}"><div class="poster" style="${pbg(i)}">${S.watched[m.id]?'<span class="tick">Watched</span>':''}<b>${esc(m.t)}</b></div><div class="meta">${m.y}</div>${showBar?`<div class="bar"><i style="width:${(S.progress[i]||0)*100}%"></i></div>`:''}</button>`}

function home(){
const cont=Object.keys(S.progress).filter(i=>!S.watched[CAT[i].id]);
return `${cont.length?`<h2>Continue watching</h2><div class="row">${cont.map(i=>card(i,true)).join("")}</div>`:''}
<h2>Silent era and classics</h2><div class="row">${[0,1,2].map(i=>card(i)).join("")}</div>
<h2>Mystery and thrills</h2><div class="row">${[3,4,5].map(i=>card(i)).join("")}</div>
<div id="arows"></div>${S.addons.length?'':'<div class="panel"><h3>Add more catalogs</h3><p>Ski Media loads catalogs and sources from addons you install yourself. Add an addon URL in Settings.</p><button class="btn alt" data-tab="settings">Open settings</button></div>'}`}

let Q="";
function hits(q){q=q.trim().toLowerCase();if(!q)return[];return CAT.map((m,i)=>i).filter(i=>{const m=CAT[i],x=META[m.id];return[m.t,m.y,x.dir,x.cast.join(" "),x.gen.join(" ")].join(" ").toLowerCase().includes(q)})}
function results(){const q=Q.trim();if(!q)return `<p class="meta">Search by title, year, director, actor or genre.</p><h2>Browse all</h2><div class="grid">${CAT.map((m,i)=>i).filter(i=>!CAT[i].tid).map(i=>card(i)).join("")}</div>`;
const h=hits(Q).filter(i=>!CAT[i].tid);let out=h.length?`<h2>In your catalog</h2><div class="grid">${h.map(i=>card(i)).join("")}</div>`:"";
if(!S.tmdb.on)out+=`<div class="panel" style="margin-top:16px"><h3>Search TMDB</h3><p>Link your TMDB API key in Settings to search every movie and show.</p><button class="btn alt" data-tab="settings">Open settings</button></div>`;
else if(TS==="loading")out+=`<p class="meta">Searching TMDB...</p>`;
else if(TS==="error")out+=`<div class="panel" style="margin-top:16px"><h3>Can't reach TMDB</h3><p>The search request failed. Check that your API key is correct and that you're online. Previews hosted on claude.ai also block requests to other sites.</p></div>`;
else if(TS==="done")out+=TR.length?`<h2>From TMDB</h2><div class="grid">${TR.map(i=>card(i)).join("")}</div>`:`<p class="meta">TMDB has no matches for "${esc(Q)}".</p>`;
return out||`<p class="meta">No matches for "${esc(Q)}". Try a title, actor or genre.</p>`}
let TR=[],TS="idle",st;
function show(){const r=$("#res");if(r)r.innerHTML=results()}
function pbg(i){const m=CAT[i];return m.poster?`background:url(${m.poster}) center/cover,${grad(i).slice(11)}`:grad(i)}
function adopt(x){const tv=x.media_type==="tv",id="tmdb"+(tv?"tv":"m")+x.id;let i=CAT.findIndex(m=>m.id===id);if(i<0){const o={id,tid:x.id,type:tv?"series":"movie",t:x.title||x.name||"Untitled",y:+((x.release_date||x.first_air_date||"").slice(0,4))||"",d:x.overview||"No overview yet.",g:x.id%6,poster:x.poster_path?"https://image.tmdb.org/t/p/w342"+x.poster_path:""};CAT.push(o);META[id]={r:x.vote_average||0,rt:0,gen:[],dir:"Unknown",cast:[]};S.extra.push(o);save();i=CAT.length-1}return i}
function tsearch(q){clearTimeout(st);TR=[];const t=q.trim();if(!S.tmdb.on||t.length<2){TS="idle";show();return}TS="loading";show();
st=setTimeout(async()=>{try{const r=await(await fetch(`https://api.themoviedb.org/3/search/multi?query=${encodeURIComponent(t)}&include_adult=false&api_key=${encodeURIComponent(S.tmdb.key)}`)).json();if(q!==Q)return;if(!r.results)throw 0;TR=r.results.filter(x=>x.media_type==="movie"||x.media_type==="tv").slice(0,18).map(adopt);TS="done"}catch(e){if(q!==Q)return;TS="error"}show()},350)}
function skIds(m){const x=m.aid||m.id;if(/^tt\d+$/.test(x))return{imdb:x};if(m.tid)return{tmdb:m.tid};return null}
async function pushQ(){if(!S.simkl.on||!S.simkl.cid||!S.queue.length)return;
const q=S.queue.slice(),E=()=>({movies:[],shows:[]}),H=E(),A=E(),R=E();
for(const e of q){const a=e.split(":")[0],raw=e.slice(a.length+1).split("|"),id=raw[0],m=CAT.find(c=>c.id===id);if(!m)continue;const ids=skIds(m);if(!ids)continue;const k=isTv(m)?"shows":"movies";
if(a==="history")H[k].push({ids,watched_at:new Date().toISOString()});else if(a==="watchlist")A[k].push({to:"plantowatch",ids});else if(a==="unwatch")R[k].push({ids});else if(a==="episode"||a==="unepisode"){(a==="episode"?H:R).shows.push({ids,seasons:[{number:+raw[1],episodes:[a==="episode"?{number:+raw[2],watched_at:new Date().toISOString()}:{number:+raw[2]}]}]})}}
const P=(p,x)=>(x.movies.length||x.shows.length)?Ski.simkl.call(S.simkl.cid,S.simkl.token,p,{method:"POST",body:JSON.stringify(x)}):0;
await P("/sync/history",H);await P("/sync/add-to-list",A);await P("/sync/history/remove",R);
S.queue=S.queue.slice(q.length);save()}
async function doSync(quiet){try{await pushQ();const r=await Ski.simkl.call(S.simkl.cid,S.simkl.token,"/sync/all-items/");let n=0;
for(const k of["movies","shows"])for(const e of r[k]||[]){const it=e.movie||e.show,im=it&&it.ids&&it.ids.imdb;if(!im)continue;const i=CAT.findIndex(c=>(c.aid||c.id)===im);if(i<0)continue;
if(e.status==="completed"&&!S.watched[CAT[i].id]){S.watched[CAT[i].id]=1;n++}
if(e.status==="plantowatch"&&!S.watchlist.includes(i)){S.watchlist.push(i);n++}}
save();render();if(!quiet)toast(n?"Synced. "+n+" update"+(n==1?"":"s")+" from Simkl":"Simkl is up to date")}catch(e){if(!quiet)toast(e.message)}}
async function startPin(c){const box=$("#pinbox");box.textContent="Getting a code...";
try{const p=await Ski.simkl.pin(c);if(!p.user_code)throw new Error("Simkl didn't return a code. Check your client ID.");
const u=p.verification_url||"https://simkl.com/pin";
box.innerHTML=`Go to <a href="${esc(u)}" target="_blank" rel="noopener" style="color:var(--blue)">${esc(u)}</a> and enter <b style="font-size:20px;letter-spacing:2px;color:var(--snow)">${esc(p.user_code)}</b>. Waiting for approval...`;
const end=Date.now()+(p.expires_in||900)*1000;startPin.id=p.user_code;
while(Date.now()<end&&startPin.id===p.user_code){await new Promise(r=>setTimeout(r,(p.interval||5)*1000));if(startPin.id!==p.user_code)return;
const r=await Ski.simkl.poll(c,p.user_code);if(r.result==="OK"&&r.access_token){S.simkl.token=r.access_token;S.simkl.on=true;save();render();toast("Simkl linked");doSync(true);return}}
const b=$("#pinbox");if(b)b.textContent="The code expired. Tap Link with Simkl for a new one."}
catch(e){const b=$("#pinbox");if(b)b.textContent=e.message}}
function scrobbleVideo(v,m){if(!S.simkl.on||!S.simkl.scrobble)return;const ids=skIds(m);if(!ids)return;const tv=isTv(m),key=m.id+"|"+EP.s+"|"+EP.e,epn={season:EP.s,number:EP.e};
const go=a=>{const pr=v.duration?Math.min(100,v.currentTime/v.duration*100):0,b=tv?{show:{ids},episode:epn}:{movie:{ids}};b.progress=+pr.toFixed(1);Ski.simkl.call(S.simkl.cid,S.simkl.token,"/scrobble/"+a,{method:"POST",body:JSON.stringify(b)}).catch(()=>{})};
v.addEventListener("play",()=>go("start"));v.addEventListener("pause",()=>{if(!v.ended)go("pause")});
v.addEventListener("ended",()=>{go("stop");if(tv)S.eps[key]=1;else S.watched[m.id]=1;save()})}
const RC={};let STR=[];
function adoptM(m,type){const id="addon"+type+m.id;let i=CAT.findIndex(c=>c.id===id);
if(i<0){const o={id,aid:m.id,type,t:m.name||"Untitled",y:String(m.releaseInfo||m.year||"").slice(0,4),d:m.description||"No description.",g:[...id].reduce((a,c)=>a+c.charCodeAt(0),0)%6,poster:/^https?:/.test(m.poster||"")?m.poster:""};
CAT.push(o);META[id]={r:0,rt:0,gen:[],dir:"Unknown",cast:[]};S.extra.push(o);save();i=CAT.length-1}return i}
async function loadRows(){const t=loadRows.t=(loadRows.t||0)+1;
for(const a of S.addons)for(const c of a.cats.slice(0,3)){const k=a.url+c.type+c.id;
try{RC[k]=RC[k]||await Ski.catalog(a,c)}catch(e){continue}
const el=$("#arows");if(!el||t!==loadRows.t)return;
el.insertAdjacentHTML("beforeend",`<h2>${esc(c.name)} from ${esc(a.name)}</h2><div class="row">${RC[k].slice(0,20).map(m=>card(adoptM(m,c.type))).join("")}</div>`)}}
function isTv(m){return m.type==="tv"||m.type==="series"}
let EP={i:-1,s:1,e:1};const MC={};
async function loadMeta(m){for(const a of S.addons.filter(a=>a.res.includes("meta"))){try{const r=await Ski.j(`${a.url}/meta/series/${encodeURIComponent(m.aid||m.id)}.json`);const v=((r.meta&&r.meta.videos)||[]).filter(x=>x.season>0&&x.episode>0);if(v.length)return v}catch(e){}}return[]}
async function loadEps(){const i=view,m=CAT[i],el=$("#eps");if(!el)return;const id=m.aid||m.id;
if(!/^tt\d+$/.test(id)){el.innerHTML=S.tmdb.on?'<p class="meta">Looking up this series...</p>':'<p class="meta">Link TMDB in Settings, or open this series from a catalog addon, to find its sources.</p>';if(S.tmdb.on)loadTmdb(i);return}
if(!(id in MC))MC[id]=await loadMeta(m);if(view!==i||!$("#eps"))return;
const v=MC[id],ss=[...new Set(v.map(x=>x.season))].sort((a,b)=>a-b);
if(EP.i!==i){EP={i,s:ss[0]||1,e:1};if(v.length)EP.e=Math.min(...v.filter(x=>x.season===EP.s).map(x=>x.episode))}
const ep=v.filter(x=>x.season===EP.s).sort((a,b)=>a.episode-b.episode);
$("#eps").innerHTML=v.length?`<div style="display:flex;gap:8px"><select id="sn" aria-label="Season">${ss.map(n=>`<option value="${n}" ${n===EP.s?"selected":""}>Season ${n}</option>`).join("")}</select><select id="en" aria-label="Episode">${ep.map(x=>`<option value="${x.episode}" ${x.episode===EP.e?"selected":""}>${x.episode}. ${esc(x.title||x.name||"Episode "+x.episode)}${S.eps[m.id+"|"+EP.s+"|"+x.episode]?" (watched)":""}</option>`).join("")}</select></div>`:`<p class="meta">No episode list from your addons. Enter the episode to find sources for.</p><div style="display:flex;gap:8px"><input id="sn" type="number" min="1" value="${EP.s}" aria-label="Season"><input id="en" type="number" min="1" value="${EP.e}" aria-label="Episode"></div>`;
loadStreams()}
async function loadStreams(){if(!$("#streams"))return;const i=view,m=CAT[i],tv=isTv(m),id=m.aid||m.id;
if(tv&&!/^tt\d+$/.test(id)){$("#streams").innerHTML='<p class="meta" style="padding:12px 0">Looking up this series...</p>';return}
const sid=tv?`${id}:${EP.s}:${EP.e}`:id;$("#streams").innerHTML='<p class="meta" style="padding:12px 0">Loading sources...</p>';
const s=await Ski.streams(S.addons,tv?"series":(m.type||"movie"),sid);const el=$("#streams");
if(view!==i||!el||(tv&&sid!==`${id}:${EP.s}:${EP.e}`))return;STR=s.slice(0,40);
el.innerHTML=STR.length?STR.map((x,n)=>{const k=/^https?:/i.test(x.url||"")?"Direct":(x.infoHash||/btih:/i.test(x.url||""))?"Debrid":"Unsupported";
return `<div class="src"><div><b>${esc(String(x.name||x.addon).replace(/\n/g," "))}</b><small>${esc(String(x.title||x.description||"").split("\n")[0])}</small></div><span class="chip ${k==="Direct"?"direct":k==="Debrid"?"cached":"lock"}">${k}</span><button class="btn alt" style="margin:0;padding:8px 12px" data-rs="${n}">Play</button></div>`}).join(""):'<p class="meta" style="padding:12px 0">No sources found from your addons for this title.</p>'}
function search(){return `<h2>Search</h2><input id="q" type="search" value="${esc(Q)}" placeholder="Search titles, cast, genres" autocomplete="off" aria-label="Search"><div id="res" style="margin-top:14px">${results()}</div><p class="note">Titles from TMDB appear when your API key is linked.</p>`}
function lib(){
const wl=S.watchlist,w=CAT.map((m,i)=>i).filter(i=>S.watched[CAT[i].id]);
return `<h2>Watchlist</h2>${wl.length?`<div class="row">${wl.map(i=>card(i)).join("")}</div>`:'<p class="meta">Nothing saved yet. Open a title and tap Save.</p>'}
<h2>Watched history</h2>${w.length?`<div class="row">${w.map(i=>card(i)).join("")}</div>`:'<p class="meta">Titles you finish show up here.</p>'}
<div class="panel" style="margin-top:18px"><h3>Simkl sync</h3><span class="status ${S.simkl.on?'on':''}">${S.simkl.on?'Linked':'Not linked'}</span><p>${S.simkl.on?`${S.queue.length} change${S.queue.length==1?'':'s'} waiting to sync.`:'Link Simkl in Settings to sync your watchlist and history.'}</p>${S.simkl.on?'<button class="btn" data-sync>Sync now</button>':''}</div>`}

function detail(){
const i=view,m=CAT[i],sv=S.watchlist.includes(i);
return `<button class="back" data-back>Back</button>
<div class="hero" style="${heroBg(i)}"><h2>${esc(m.t)}</h2><p>${m.y} · ${isTv(m)?"Series":"Movie"}</p></div>
${cine(i)}
<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn red" data-watch>${S.watched[m.id]?'Watch again':'Play'}</button><button class="btn alt" data-save>${sv?'Remove from watchlist':'Save to watchlist'}</button><button class="btn alt" data-mark>${isTv(m)?(S.eps[m.id+"|"+EP.s+"|"+EP.e]?'Mark episode unwatched':'Mark episode watched'):S.watched[m.id]?'Mark unwatched':'Mark watched'}</button></div>
${isTv(m)&&S.addons.length?'<h2>Episodes</h2><div id="eps"></div>':''}<h2>Sources</h2>${S.addons.length?'<div class="panel" id="streams" style="padding:2px 14px"><p class="meta" style="padding:12px 0">Loading sources...</p></div>':''}<div class="panel" style="padding:2px 14px;${S.addons.length?'display:none':''}">${SRC.map((s,n)=>{
const blocked=s.k!=="direct"&&!S.debrids.length;
return `<div class="src"><div><b>${esc(s.n)}</b><small>${esc(s.s)}${s.k==="cached"&&S.debrids.length?" via "+esc(S.debrids[0].prov):""}</small></div><span class="chip ${blocked?'lock':s.k}">${blocked?'Link debrid':s.q}</span><button class="btn alt" style="margin:0;padding:8px 12px" data-src="${n}">Play</button></div>`}).join("")}</div>
${S.debrids.length?'':'<p class="meta">Debrid sources unlock after you link a debrid account in Settings.</p>'}
<div class="player" id="pl" hidden></div>`}

function settings(){
return `<div class="panel"><h3>Simkl</h3><span class="status ${S.simkl.on?'on':''}">${S.simkl.on?'Linked':'Not linked'}</span>
<p>Sync your watchlist and watch history with Simkl, and scrobble movies while you watch.</p>
${S.simkl.on?`<label style="display:flex;gap:8px;align-items:center;color:var(--snow)"><input type="checkbox" id="sc" style="width:auto" ${S.simkl.scrobble?'checked':''}>Scrobble movies while playing</label><button class="btn" data-sync>Sync now</button> <button class="btn alt" data-unlink="simkl">Unlink</button>`:`<label for="skid">Simkl client ID</label><input id="skid" autocomplete="off" value="${esc(S.simkl.cid||'')}" placeholder="From simkl.com/settings/developer"><button class="btn" data-skpin>Link with Simkl</button><div id="pinbox" class="meta" style="margin-top:10px"></div>`}</div>
<div class="panel"><h3>Debrid accounts</h3><span class="status ${S.debrids.length?'on':''}">${S.debrids.length?S.debrids.length+' linked':'Not linked'}</span>
<p>Link as many services as you like. Sources use them in the order shown.</p>
${S.debrids.map((d,n)=>`<div class="src"><div><b>${esc(d.prov)}</b><small>${n===0?'Primary':'Backup'}</small></div>${n?`<button class="btn alt" style="margin:0;padding:8px 12px" data-top="${n}">Make primary</button>`:''}<button class="btn alt" style="margin:0;padding:8px 12px" data-rmdeb="${n}">Remove</button></div>`).join("")}
${(f=>f.length?`<label for="dp">Add a service</label><select id="dp">${f.map(p=>`<option>${p}</option>`).join("")}</select>
<label for="dt">API token</label><input id="dt" type="password" autocomplete="off" placeholder="Paste your API token">
<button class="btn" data-link="debrid">Link account</button>`:'<p class="meta">All supported services are linked.</p>')(PROVIDERS.filter(p=>!S.debrids.some(d=>d.prov===p)))}</div>
<div class="panel"><h3>TMDB</h3><span class="status ${S.tmdb.on?'on':''}">${S.tmdb.on?'Linked':'Not linked'}</span>
<p>Load posters, backdrops, cast, ratings and runtimes from The Movie Database.</p>
<label for="tk">TMDB API key</label><input id="tk" type="password" autocomplete="off" value="${esc(S.tmdb.key)}" placeholder="Paste your API key">
<button class="btn" data-link="tmdb">${S.tmdb.on?'Update':'Link TMDB'}</button> ${S.tmdb.on?'<button class="btn alt" data-unlink="tmdb">Unlink</button>':''}</div>
<div class="panel"><h3>Addons</h3><p>Paste the manifest URL of an addon you want to install. Ski Media uses the Stremio addon format.</p>
<input id="ad" placeholder="https://example.com/manifest.json" inputmode="url">
<button class="btn" data-addon>Install addon</button>
${S.addons.map((a,n)=>`<div class="src"><div><b>${esc(a.name||a)}</b><small>${esc(a.url||"")}</small></div><button class="btn alt" style="margin:0;padding:8px 12px" data-rm="${n}">Remove</button></div>`).join("")}</div>
<p class="note">Prototype: links are stored on this device only and are not verified with Simkl or your debrid provider. The packaged app does the real sign-in and playback. Use only content you have the right to watch.</p>`}

function render(){
const tabs=[["home","Home"],["search","Search"],["lib","Library"],["settings","Settings"]];
$("#nav").innerHTML=tabs.map(t=>`<button data-tab="${t[0]}" aria-current="${S.tab===t[0]&&view===null}">${t[1]}</button>`).join("");
$("#hdr").textContent=(S.simkl.on?"Simkl ":"")+(S.debrids.length&&S.simkl.on?"· ":"")+(S.debrids.length?S.debrids.length+(S.debrids.length==1?" debrid":" debrids"):"");
$("#app").innerHTML=view!==null?detail():S.tab==="home"?home():S.tab==="search"?search():S.tab==="lib"?lib():settings();
if(view===null&&S.tab==="home")loadRows();else if(view!==null)(isTv(CAT[view])?loadEps():loadStreams());
}
function queue(a){if(S.simkl.on){S.queue.push(a);clearTimeout(queue.t);queue.t=setTimeout(()=>pushQ().catch(()=>{}),1500)}}
document.addEventListener("click",e=>{
const el=e.target.closest("button");if(!el)return;const d=el.dataset;
if(d.tab){S.tab=d.tab;view=null;save();render();scrollTo(0,0);return}
if(d.open!==undefined){view=+d.open;render();scrollTo(0,0);loadTmdb(view);return}
if(d.back!==undefined){view=null;render();return}
if(d.save!==undefined){const i=S.watchlist.indexOf(view);if(i>-1)S.watchlist.splice(i,1);else{S.watchlist.push(view);queue("watchlist:"+CAT[view].id)}save();render();toast(i>-1?"Removed from watchlist":"Saved to watchlist");return}
if(d.mark!==undefined){const id=CAT[view].id;if(isTv(CAT[view])){const k=id+"|"+EP.s+"|"+EP.e;if(S.eps[k]){delete S.eps[k];queue("unepisode:"+k)}else{S.eps[k]=1;queue("episode:"+k)}save();render();toast("Episode updated");return}
if(S.watched[id]){delete S.watched[id];queue("unwatch:"+id)}else{S.watched[id]=1;delete S.progress[view];queue("history:"+id)}save();render();toast("Updated");return}
if(d.watch!==undefined||d.src!==undefined){
const n=d.src!==undefined?+d.src:0,s=SRC[n];
if(s.k!=="direct"&&!S.debrids.length){toast("Link a debrid account in Settings first");return}
const p=$("#pl");p.hidden=false;p.textContent="Playing "+CAT[view].t+" · "+s.q+(s.k==="direct"?"":" · via "+S.debrids[0].prov)+(S.simkl.on&&S.simkl.scrobble?" · scrobbling to Simkl":"");
S.progress[view]=Math.max(S.progress[view]||0,.05);save();return}
if(d.link){
if(d.link==="tmdb"){const v=$("#tk").value.trim();if(!v){toast("Paste your TMDB API key first");return}S.tmdb={on:true,key:v};toast("TMDB linked")}
else if(d.link==="simkl"){const v=$("#sk").value.trim();if(!v){toast("Paste your Simkl token first");return}S.simkl.token=v;S.simkl.on=true;S.simkl.scrobble=$("#sc").checked;toast("Simkl linked")}
else{const v=$("#dt").value.trim();if(!v){toast("Paste your API token first");return}S.debrids.push({prov:$("#dp").value,token:v});toast($("#dp").value+" linked")}
save();render();return}
if(d.unlink){if(d.unlink==="tmdb"){S.tmdb={on:false,key:""}}else if(d.unlink==="simkl"){S.simkl={on:false,token:"",scrobble:true,cid:S.simkl.cid};S.queue=[]}else S.debrid={on:false,prov:"Real-Debrid",token:""};save();render();toast("Unlinked");return}
if(d.refresh!==undefined){Object.keys(TM).forEach(k=>delete TM[k]);Object.keys(RC).forEach(k=>delete RC[k]);if(S.simkl.on)doSync(true);save();render();if(view!==null)loadTmdb(view);toast(S.simkl.on?"Refreshed and synced Simkl":"Refreshed");return}
if(d.rs!==undefined){const s=STR[+d.rs],p=$("#pl"),vi=view;p.hidden=false;p.textContent="Preparing...";
(async()=>{try{let url=/^https?:/i.test(s.url||"")?s.url:"";
if(!url){const hash=s.infoHash||((s.url||"").match(/btih:([a-f0-9]{40})/i)||[])[1];if(!hash)throw new Error("This source type isn't supported yet");
if(!S.debrids.length)throw new Error("Link a debrid account in Settings first");
const rd=S.debrids.find(x=>x.prov==="Real-Debrid");if(!rd)throw new Error("Only Real-Debrid is supported for now");
url=await Ski.rd.resolve(rd.token,hash,s.fileIdx,t=>{p.textContent="Real-Debrid: "+t})}
if(view!==vi)return;p.textContent="";p.style.padding="0";p.style.aspectRatio="auto";
const v=document.createElement("video");v.controls=true;v.autoplay=true;v.playsInline=true;v.style.cssText="width:100%;border-radius:10px";v.src=url;p.appendChild(v);scrobbleVideo(v,CAT[vi]);
S.progress[vi]=Math.max(S.progress[vi]||0,.05);save()}catch(err){p.textContent=err.message}})();return}
if(d.skpin!==undefined){const c=$("#skid").value.trim();if(!c){toast("Paste your Simkl client ID first");return}S.simkl.cid=c;save();startPin(c);return}
if(d.rmdeb!==undefined){S.debrids.splice(+d.rmdeb,1);save();render();toast("Service removed");return}
if(d.top!==undefined){const a=S.debrids.splice(+d.top,1);S.debrids.unshift(a[0]);save();render();toast("Primary service updated");return}
if(d.addon!==undefined){const v=$("#ad").value.trim().replace(/^stremio:\/\//,"https://");if(!/^https?:\/\/.+manifest\.json$/i.test(v)){toast("Enter a full manifest.json URL");return}toast("Installing...");Ski.addon(v).then(a=>{S.addons.push(a);save();render();toast(a.name+" installed")}).catch(()=>toast("Couldn't load that addon"));return}
if(d.rm!==undefined){S.addons.splice(+d.rm,1);save();render();return}
if(d.sync!==undefined){toast("Syncing...");doSync();return}
});
document.addEventListener("change",e=>{if(e.target.id==="sn"||e.target.id==="en"){const m=CAT[view];if(e.target.id==="sn"){EP.s=+e.target.value||1;const f=(MC[m.aid||m.id]||[]).filter(x=>x.season===EP.s).map(x=>x.episode);EP.e=f.length?Math.min(...f):1}else EP.e=+e.target.value||1;render();return}
if(e.target.id==="sc"){S.simkl.scrobble=e.target.checked;save()}});
document.addEventListener("input",e=>{if(e.target.id==="q"){Q=e.target.value;show();tsearch(Q)}});
render();
</script>
</body>
</html>
