name: Build Android APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html engine.js manifest.json icon.svg www/
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        run: |
          npm install
          npx cap add android
          if [ -f icon-only.png ] && [ -f icon-foreground.png ] && [ -f splash.png ]; then
            mkdir -p assets
            cp icon-only.png icon-foreground.png splash.png assets/
            cp splash.png assets/splash-dark.png
            npx @capacitor/assets@3.0.5 generate --android --iconBackgroundColor '#f5f5f3' --iconBackgroundColorDark '#f5f5f3' --splashBackgroundColor '#f5f5f3' --splashBackgroundColorDark '#f5f5f3' || echo "Icon generation skipped"
          fi
          JAVA_DIR=android/app/src/main/java/com/skimedia/app
          mkdir -p $JAVA_DIR
          cat > $JAVA_DIR/VlcPlugin.java <<'JAVA'
          package com.skimedia.app;

          import android.content.ActivityNotFoundException;
          import android.content.Intent;
          import android.net.Uri;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "Vlc")
          public class VlcPlugin extends Plugin {
              @PluginMethod
              public void play(PluginCall call) {
                  String url = call.getString("url");
                  String title = call.getString("title", "");
                  if (url == null || url.isEmpty()) {
                      call.reject("No link to play");
                      return;
                  }
                  Intent intent = new Intent(Intent.ACTION_VIEW);
                  intent.setDataAndType(Uri.parse(url), "video/*");
                  intent.putExtra("title", title);
                  intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  intent.setPackage("org.videolan.vlc");
                  try {
                      getContext().startActivity(intent);
                      call.resolve();
                  } catch (ActivityNotFoundException e) {
                      call.reject("VLC is not installed");
                  }
              }
          }
          JAVA
          cat > $JAVA_DIR/MainActivity.java <<'JAVA'
          package com.skimedia.app;

          import android.os.Bundle;
          import android.widget.Toast;
          import androidx.activity.OnBackPressedCallback;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              private long lastBack = 0;
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(VlcPlugin.class);
                  super.onCreate(savedInstanceState);
                  getOnBackPressedDispatcher().addCallback(this, new OnBackPressedCallback(true) {
                      @Override
                      public void handleOnBackPressed() {
                          if (getBridge() == null || getBridge().getWebView() == null) { finish(); return; }
                          getBridge().getWebView().evaluateJavascript(
                              "(function(){try{return window.__skiBack?window.__skiBack():0}catch(e){return 0}})()",
                              value -> {
                                  if ("1".equals(value)) return;
                                  long now = System.currentTimeMillis();
                                  if (now - lastBack < 2000) {
                                      finish();
                                  } else {
                                      lastBack = now;
                                      Toast.makeText(MainActivity.this, "Press back again to exit", Toast.LENGTH_SHORT).show();
                                  }
                              });
                      }
                  });
              }
          }
          JAVA
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ski-media-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
