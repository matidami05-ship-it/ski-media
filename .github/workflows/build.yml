          import re
          p = "android/app/src/main/AndroidManifest.xml"
          m = open(p, encoding="utf-8").read()
          feats = '    <uses-feature android:name="android.hardware.touchscreen" android:required="false" />\n    <uses-feature android:name="android.software.leanback" android:required="false" />\n'
          if "android.software.leanback" not in m:
              m = m.replace("<application", feats + "\n    <application", 1)
          if "android:banner" not in m:
              m = m.replace("<application", '<application\n        android:banner="@drawable/tv_banner"', 1)
          if "LEANBACK_LAUNCHER" not in m:
              m = re.sub(r'(<category android:name="android.intent.category.LAUNCHER"\s*/>)', r'\1\n                <category android:name="android.intent.category.LEANBACK_LAUNCHER" />', m, count=1)
          open(p, "w", encoding="utf-8").write(m)
          print("Manifest patched for Android TV")
