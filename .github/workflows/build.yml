          cat > make_icons.py <<'PY'
          from PIL import Image, ImageDraw
          import os
          res = "android/app/src/main/res"
          ico = Image.open("icon-only.png").convert("RGB")
          fg = Image.open("icon-foreground.png").convert("RGB")
          # (folder, legacy launcher px, adaptive foreground px)
          for d, leg, ad in [("mdpi",48,108),("hdpi",72,162),("xhdpi",96,216),("xxhdpi",144,324),("xxxhdpi",192,432)]:
              out = os.path.join(res, "mipmap-" + d)
              os.makedirs(out, exist_ok=True)
              sq = ico.resize((leg, leg), Image.LANCZOS)
              r = int(leg * 0.22)
              m = Image.new("L", (leg * 4, leg * 4), 0)
              ImageDraw.Draw(m).rounded_rectangle([0, 0, leg * 4 - 1, leg * 4 - 1], r * 4, fill=255)
              m = m.resize((leg, leg), Image.LANCZOS)
              a = Image.new("RGBA", (leg, leg), (0, 0, 0, 0)); a.paste(sq, (0, 0), m)
              a.save(os.path.join(out, "ic_launcher.png"))
              c = Image.new("L", (leg * 4, leg * 4), 0)
